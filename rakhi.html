    <style>
        body {

        .page { display: none; width: 100%; height: 100%; position: absolute; inset: 0; }
        .page.active { display: flex; animation: fadeIn 0.8s ease forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes cinematicFade { 0% { opacity: 0; filter: blur(10px); transform: translateY(15px); } 30% { opacity: 1; filter: blur(0px); transform: translateY(0px); } 70% { opacity: 1; filter: blur(0px); transform: translateY(0px); } 100% { opacity: 0; filter: blur(10px); transform: translateY(-15px); } }

        .intro-step { position: absolute; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .intro-step.show { animation: cinematicFade 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
        .floating-element { animation: floatSlow 3s ease-in-out infinite; }
        @keyframes pulseGlow { 0%, 100% { filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); transform: scale(1); } 50% { filter: drop-shadow(0 0 30px rgba(212,175,55,0.8)); transform: scale(1.05); } }
        @keyframes rakhiFloat { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
        
        .glow-effect { animation: pulseGlow 2.5s infinite; cursor: pointer; }

        .bg-gradient-page34 { background: radial-gradient(circle at center, #420a0c 0%, #1a0303 100%); }
        
        .envelope-bg { background: linear-gradient(145deg, #4a151b 0%, #2e0b0e 100%); }
        .envelope-flap { background: linear-gradient(#5c1b22 0%, #3b0e12 100%); clip-path: polygon(0 0, 100% 0, 50% 100%); }
        .btn-outline { border: 1px solid rgba(212,175,55,0.6); color: #d4af37; transition: all 0.3s; cursor: pointer; border-radius: 8px; }
        .btn-outline:hover { background: rgba(212,175,55,0.1); border-color: #d4af37; color: #fceecb; }
        
        .cursor::after { content: '|'; animation: blink 1s step-end infinite; color: #d4af37; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }

        #volume-checkbox { display: none; }
        .volume-label { cursor: pointer; width: 28px; height: 28px; display: block; }
        .volume-label svg { width: 100%; height: 100%; fill: #d4af37; transition: fill 0.3s ease; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .volume-label:hover svg { fill: #fceecb; }
        #volume-checkbox:checked + .volume-label svg:nth-child(2) { display: none; }
        #volume-checkbox:not(:checked) + .volume-label svg:nth-child(1) { display: none; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        // Display name directly on receiver page
        if (receiverName) {
            document.getElementById('sister-name-display').innerText = `Just for My Sister ${receiverName}`;
        }

        const volumeCheckbox = document.getElementById('volume-checkbox');
        volumeCheckbox.addEventListener('change', function() { document.getElementById('hiddenAudio').muted = !this.checked; });

        let typeInterval;

        function startTypewriter() {
            const textElement = document.getElementById('typewriter-text');
            const scrollContainer = document.getElementById('letter-scroll-container');
            
            textElement.textContent = '';
            clearInterval(typeInterval);
            
            const chars = Array.from(letterContent);
            let i = 0;

            typeInterval = setInterval(() => {
                if (i < chars.length) {
                    textElement.textContent += chars[i];
                    i++;
                    scrollContainer.scrollTop = scrollContainer.scrollHeight;
                } else {
                    clearInterval(typeInterval);
                    textElement.classList.remove('cursor');
                }
            }, 35);
        }

        function goToPage(pageNumber) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            const activePage = document.getElementById('page' + pageNumber);
            
            if (activePage) {
                activePage.style.animation = 'none'; activePage.offsetHeight; activePage.style.animation = null; activePage.classList.add('active');
                const bottomBar = document.getElementById('bottom-bar');
                if (pageNumber === 1) bottomBar.style.display = 'flex'; else bottomBar.style.display = 'none';
                if (pageNumber === 5) { document.getElementById('typewriter-text').classList.add('cursor'); startTypewriter(); } else clearInterval(typeInterval);
